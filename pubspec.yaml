name: tunceli_ulasim
description: "Tunceli Belediyesi Ulaşım Mobil Uygulaması"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  http: ^1.5.0
  html: ^0.15.6
  url_launcher: ^6.3.2
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/app_icon.png"

  adaptive_icon_background: "#00695C"
  adaptive_icon_foreground: "assets/images/app_icon.png"

  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#0B7A6E"
  android: true
  ios: true
  fullscreen: true

  android_12:
    color: "#0B7A6E"
